name: Validate content

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate skills and subagents
        run: python3 scripts/validate_content.py
      - name: Validate handoff templates
        run: python3 scripts/validate_handoff.py --templates-dir templates/handoffs
      - name: Check catalog freshness
        run: python3 scripts/diff_catalog.py
      - name: Build Cursor rules
        run: python3 scripts/build_cursor_rules.py --skills-dir skills --out-dir .cursor/rules
      - name: List catalog content
        run: python3 scripts/list_content.py --format markdown
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
